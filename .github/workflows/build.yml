name: FORCE BUILD - OreMC Police

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Find Project
        shell: bash
        run: |
          if [ -f "OreMCPolice/build.gradle" ]; then
            echo "PROJECT_DIR=OreMCPolice" >> $GITHUB_ENV
          elif [ -f "build.gradle" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            echo "ERROR: build.gradle not found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

      - name: Force Build
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon --stacktrace

      - name: Find JAR
        shell: bash
        run: |
          find "$PROJECT_DIR/build/libs" -name "*.jar" -type f

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: OreMCPolice-FORCE-BUILD
          path: |
            OreMCPolice/build/libs/*.jar
            build/libs/*.jar
          if-no-files-found: error
